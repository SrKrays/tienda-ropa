# Render Blueprint: crea la API (Render → New → Blueprint → elegir este repo).
# La base de datos es MySQL en Clever Cloud: pegá su "Connection URI" en DATABASE_URL.
services:
  - type: web
    name: tienda-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # mysql://usuario:clave@host-de-clever:3306/base
      - key: IMAGE_STORE
        value: db
      - key: JWT_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false # ej: https://tienda-ropa.vercel.app
      - key: STORE_NAME
        value: "[MARCA]"
